name: probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Machine
        run: |
          { echo '### Machine'; echo '```'; nproc; free -h; df -h /; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force > /dev/null || true
          sudo apt-get clean
          { echo '### Disk after cleanup'; echo '```'; df -h /; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Latest WebRTC release branches
        run: |
          { echo '### WebRTC branch-heads (latest 5)'; echo '```'
            git ls-remote https://webrtc.googlesource.com/src 'refs/branch-heads/*' \
              | awk '{print $2}' | sed 's#refs/branch-heads/##' \
              | grep -E '^[0-9]+$' | sort -n | tail -5
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Current stable Chrome
        run: |
          { echo '### Chrome stable (Android)'; echo '```'
            curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1"
            echo; echo '```'
            echo '### Milestones'; echo '```'
            curl -s "https://chromiumdash.appspot.com/fetch_milestones?only_branched=true" | head -c 1500
            echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
